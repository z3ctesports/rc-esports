<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS | Realize Summit</title><meta name="description" content="Realize Summit ニュース詳細。"><meta name="theme-color" content="#070707"><link rel="stylesheet" href="assets/css/reset.css"><link rel="stylesheet" href="assets/css/common.css"><script src="assets/js/main.js" defer></script><script defer>document.addEventListener('DOMContentLoaded',async()=>{try{const id=new URLSearchParams(location.search).get('id')||'001',items=await fetch('data/news.json').then(r=>r.json()),n=items.find(x=>x.id===id);if(!n)throw 0;document.title=`${n.title} | Realize Summit`;document.querySelector('#article').innerHTML=`<p class="eyebrow">${n.category} / ${n.date}</p><h1 class="page-title" style="font-size:clamp(2.7rem,7vw,6rem)">${n.title}</h1><p class="statement" style="margin-top:42px">${n.lead}</p>${n.body.map((p,i)=>i===0?`<h2>Announcement</h2><p>${p}</p>`:`<p>${p}</p>`).join('')}<a class="button secondary" href="news.html" style="margin-top:40px">BACK TO NEWS</a>`}catch{document.querySelector('#article').innerHTML='<h1 class="page-title">News not found.</h1><a class="button secondary" href="news.html">BACK TO NEWS</a>'}})</script></head><body class="loading" data-page="news"><div id="site-header"></div><main><section class="section" style="padding-top:calc(var(--header) + 100px)"><article id="article" class="container article"></article></section></main><div id="site-footer"></div></body></html>
