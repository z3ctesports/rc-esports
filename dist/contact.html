<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONTACT | Realize Summit</title><meta name="description" content="Realize Summitへのお問い合わせ。"><meta name="theme-color" content="#070707"><meta property="og:title" content="CONTACT | Realize Summit"><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><link rel="canonical" href="https://realize-summit.kan1112.chatgpt.site/contact.html"><link rel="icon" type="image/png" href="assets/icons/favicon.png"><link rel="stylesheet" href="assets/css/reset.css"><link rel="stylesheet" href="assets/css/common.css"><script src="assets/js/main.js" defer></script><script src="assets/js/contact.js" defer></script></head><body class="loading" data-page="contact"><div id="site-header"></div><main><header class="page-hero"><div class="container"><p class="eyebrow">Get in touch</p><h1 class="page-title">Contact<span class="accent">.</span></h1><p>スポンサー、取材、コラボレーションなどのお問い合わせはこちらからお送りください。</p></div></header><section class="section"><div class="container contact-grid"><div><p class="eyebrow">Inquiry</p><h2 class="section-title contact-heading">CONTACT</h2><p class="muted" style="margin-top:24px">内容を確認後、担当者よりご連絡します。返信までお時間をいただく場合があります。</p></div><form id="contact-form" action="https://formspree.io/f/xyekzzjv" method="POST" novalidate><div class="form-grid"><div class="field"><label for="name">お名前 *</label><input id="name" name="name" maxlength="80" autocomplete="name"><span class="error"></span></div><div class="field"><label for="email">メールアドレス *</label><input id="email" name="email" type="email" maxlength="160" autocomplete="email"><span class="error"></span></div><div class="field"><label for="company">会社名 / 団体名（任意）</label><input id="company" name="company" maxlength="120" autocomplete="organization"><span class="error"></span></div><div class="field"><label for="type">お問い合わせ種別 *</label><select id="type" name="type"><option>スポンサー</option><option>取材</option><option>コラボレーション</option><option>チーム関連</option><option>その他</option></select><span class="error"></span></div><div class="field full"><label for="subject">件名 *</label><input id="subject" name="subject" maxlength="120"><span class="error"></span></div><div class="field full"><label for="message">お問い合わせ内容 *（20〜2000文字）</label><textarea id="message" name="message" minlength="20" maxlength="2000"></textarea><span class="error"></span></div><div class="field full consent-field"><label class="check" for="privacy"><input id="privacy" name="privacy_consent" value="同意済み" type="checkbox"><span>プライバシーポリシーに同意します。</span></label><span id="privacy-error" class="error"></span></div><div class="field full"><button class="button" type="submit">送信</button><p class="form-status" role="status" aria-live="polite"></p></div></div></form></div></section></main><div id="site-footer"></div></body></html>
